  </text>
  
  <circle cx="450" cy="120" r="20" fill="#3498db"/>
  <text x="450" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🏦</text>
  <text x="500" y="125" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Internal User of Aeon Bank Malaysia</text>
  
  <!-- Frontend Layer -->
  <rect x="50" y="180" width="550" height="120" fill="#f0f0f0" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="325" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
