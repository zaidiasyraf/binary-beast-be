  <text x="800" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Session Management</text>
  <text x="800" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• History Tracking</text>
  <text x="800" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Context Persistence</text>
  <text x="800" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Memory Management</text>
  <text x="800" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Multi-turn Chat</text>
  
