  <text x="180" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Vector Storage</text>
  <text x="180" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Similarity Search</text>
  <text x="180" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Cosine Distance</text>
  <text x="180" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Embedding Index</text>
  <text x="180" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• ACID Compliance</text>
  
