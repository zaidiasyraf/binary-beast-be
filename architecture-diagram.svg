  <text x="750" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3436">🚀 REST API ENDPOINTS</text>
  
  <rect x="370" y="100" width="150" height="40" rx="5" fill="rgba(255,255,255,0.8)" stroke="#e17055" stroke-width="1"/>
  <text x="445" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2d3436">/chat</text>
  <text x="445" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#636e72">Standard Chat</text>
  
  <rect x="540" y="100" width="150" height="40" rx="5" fill="rgba(255,255,255,0.8)" stroke="#e17055" stroke-width="1"/>
  <text x="615" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2d3436">/chat/rag</text>
  <text x="615" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#636e72">AI-Enhanced</text>
  
  <rect x="710" y="100" width="180" height="40" rx="5" fill="rgba(255,255,255,0.8)" stroke="#e17055" stroke-width="1"/>
  <text x="800" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2d3436">/rag/generate-embeddings</text>
  <text x="800" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#636e72">Vector Setup</text>
  
  <rect x="910" y="100" width="150" height="40" rx="5" fill="rgba(255,255,255,0.8)" stroke="#e17055" stroke-width="1"/>
  <text x="985" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2d3436">BedrockController</text>
  <text x="985" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#636e72">Request Handler</text>
  
  <!-- AI Services Layer (Main Focus) -->
