  <text x="1020" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Claude 3 Sonnet</text>
  <text x="1020" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Titan Embeddings</text>
  <text x="1020" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Managed AI Models</text>
  <text x="1020" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Serverless Inference</text>
  <text x="1020" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Enterprise Security</text>
  
