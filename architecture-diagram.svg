  </text>
  
  <!-- User Layer -->
  <rect x="50" y="70" width="1100" height="80" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
