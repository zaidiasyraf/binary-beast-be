  <text x="170" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3436">RAG Service</text>
  <text x="170" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Query Processing</text>
  <text x="170" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Context Retrieval</text>
  <text x="170" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Prompt Enhancement</text>
  <text x="170" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Vector Similarity</text>
  <text x="170" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Fallback Logic</text>
  
  <!-- Embedding Service -->
