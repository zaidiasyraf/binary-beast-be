  <text x="310" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Titan Integration</text>
  <text x="310" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Vector Generation</text>
  
  <rect x="400" y="580" width="140" height="60" fill="#9b59b6" stroke="#8e44ad" stroke-width="1" rx="5"/>
  <text x="470" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">RAGService</text>
  <text x="470" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Context Retrieval</text>
  <text x="470" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Similarity Search</text>
  
  <rect x="560" y="580" width="140" height="60" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="5"/>
  <text x="630" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">ConversationService</text>
  <text x="630" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Session Management</text>
  <text x="630" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">History Tracking</text>
  
  <rect x="720" y="580" width="140" height="60" fill="#27ae60" stroke="#229954" stroke-width="1" rx="5"/>
  <text x="790" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">BedrockController</text>
  <text x="790" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">REST API</text>
  <text x="790" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">/api/bedrock/*</text>
  
  <rect x="880" y="580" width="140" height="60" fill="#16a085" stroke="#138d75" stroke-width="1" rx="5"/>
  <text x="950" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">JPA Repositories</text>
  <text x="950" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Data Access</text>
  <text x="950" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Vector Queries</text>
  
  <rect x="1040" y="580" width="100" height="60" fill="#7f8c8d" stroke="#6c7b7d" stroke-width="1" rx="5"/>
  <text x="1090" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Health Check</text>
  <text x="1090" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Actuator</text>
  <text x="1090" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Monitoring</text>
  
  <!-- Data Flow Arrows -->
  <!-- User to Frontend -->
  <path d="M 150 150 L 180 220" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Frontend to Backend -->
  <path d="M 520 250 L 680 250" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="600" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">HTTPS/REST API</text>
  
  <!-- Backend to AI -->
  <path d="M 780 300 L 420 375" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 780 300 L 180 375" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Backend to Database -->
  <path d="M 880 250 L 880 375" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- RAG to Database -->
  <path d="M 400 472 L 680 405" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Key Features Box -->
