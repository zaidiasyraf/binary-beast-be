  </text>
  
  <!-- Next.js App -->
  <rect x="80" y="220" width="200" height="60" fill="url(#nextjsGradient)" stroke="#000" stroke-width="1" rx="8"/>
  <text x="180" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
