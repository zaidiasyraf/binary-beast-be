  <text x="385" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Customers</text>
  <text x="385" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Accounts</text>
  <text x="385" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Transactions</text>
  <text x="385" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Relationships</text>
  <text x="385" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Products</text>
  
  <rect x="490" y="460" width="150" height="120" rx="8" fill="rgba(255,255,255,0.9)" stroke="#00b894" stroke-width="2"/>
  <text x="565" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3436">Vector Embeddings</text>
  <text x="565" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Text → 1536D Vector</text>
  <text x="565" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Semantic Search</text>
  <text x="565" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Context Matching</text>
  <text x="565" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Relevance Scoring</text>
  <text x="565" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Auto-Generated</text>
  
  <!-- Repository Layer -->
  <rect x="670" y="460" width="200" height="120" rx="8" fill="rgba(255,255,255,0.9)" stroke="#00b894" stroke-width="2"/>
  <text x="770" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3436">Repository Layer</text>
  <text x="770" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• JPA Repositories</text>
  <text x="770" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Custom Vector Queries</text>
  <text x="770" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Similarity Functions</text>
  <text x="770" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Batch Operations</text>
  <text x="770" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Transaction Support</text>
  
  <!-- Data Ingestion -->
