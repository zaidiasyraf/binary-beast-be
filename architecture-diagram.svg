  <text x="1000" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3436">Data Ingestion</text>
  <text x="1000" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Bulk Import</text>
  <text x="1000" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Real-time Updates</text>
  <text x="1000" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Embedding Generation</text>
  <text x="1000" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Data Validation</text>
  <text x="1000" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Error Handling</text>
  
  <!-- Request Flow Arrows -->
  <!-- Client to API Endpoints -->
  <path d="M 250 110 L 350 110" stroke="#2d3436" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2d3436">HTTP Request</text>
  
  <!-- API Endpoints to AI Services -->
  <path d="M 750 150 L 600 180" stroke="#2d3436" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="675" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2d3436">Route to Services</text>
  
  <!-- AI Services to Database -->
  <path d="M 600 380 L 600 410" stroke="#2d3436" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="650" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00b894">⚡ VECTOR SEARCH</text>
  
  <!-- AI Services to Bedrock -->
  <path d="M 680 290 L 920 290" stroke="#e17055" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="800" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d63031">🔥 AI MODEL CALLS</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d3436"/>
    </marker>
  </defs>
  
  <!-- Request Flow Summary -->
  <rect x="50" y="650" width="1100" height="120" rx="15" fill="#f8f9fa" stroke="#6c5ce7" stroke-width="3"/>
  <text x="600" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3436">📊 REQUEST FLOW SUMMARY</text>
  
  <text x="150" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">1. Client Request</text>
  <text x="150" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">Web/Mobile sends</text>
  <text x="150" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">HTTP request</text>
  
  <text x="350" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">2. API Routing</text>
  <text x="350" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">Controller routes to</text>
  <text x="350" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">appropriate service</text>
  
  <text x="550" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">3. AI Processing</text>
  <text x="550" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">RAG/Embedding/</text>
  <text x="550" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">Bedrock services</text>
  
  <text x="750" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">4. Vector Search</text>
  <text x="750" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">Query database for</text>
  <text x="750" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">relevant context</text>
  
  <text x="950" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">5. AI Response</text>
  <text x="950" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">Claude generates</text>
  <text x="950" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#636e72">enhanced response</text>
  
  <!-- Key Features Box -->
  <rect x="50" y="790" width="1100" height="80" rx="8" fill="#74b9ff" stroke="#0984e3" stroke-width="2"/>
  <text x="600" y="815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">🎯 KEY AI CAPABILITIES</text>
  
  <text x="200" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Semantic Search</text>
  <text x="200" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Vector similarity matching</text>
  
  <text x="400" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Context Injection</text>
  <text x="400" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">RAG-enhanced prompts</text>
  
  <text x="600" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Smart Fallbacks</text>
  <text x="600" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Graceful error handling</text>
  
  <text x="800" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Session Memory</text>
  <text x="800" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Multi-turn conversations</text>
  
  <text x="1000" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Incremental Learning</text>
  <text x="1000" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Auto-embedding generation</text>
  
</svg>