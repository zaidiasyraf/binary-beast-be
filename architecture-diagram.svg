  <text x="380" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Text → Vector</text>
  <text x="380" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Titan Embeddings</text>
  <text x="380" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Vector Formatting</text>
  <text x="380" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Batch Processing</text>
  <text x="380" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• PostgreSQL Vector</text>
  
  <!-- Bedrock Service -->
  <rect x="500" y="230" width="180" height="120" rx="8" fill="rgba(255,255,255,0.9)" stroke="#d63031" stroke-width="2"/>
  <text x="590" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3436">Bedrock Service</text>
  <text x="590" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Claude 3 Integration</text>
  <text x="590" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Chat Completion</text>
  <text x="590" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Retry Logic</text>
  <text x="590" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Rate Limiting</text>
  <text x="590" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72">• Context Management</text>
  
