  </text>
  <text x="150" y="750" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    • Vector Similarity Search (1536-dim embeddings)
  </text>
  <text x="500" y="730" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    • Personalized Financial Insights
  </text>
  <text x="500" y="750" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    • Real-time Transaction Analysis
  </text>
  <text x="850" y="730" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    • Auto-scaling Cloud Infrastructure
  </text>
  <text x="850" y="750" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    • Enterprise-grade Security & Monitoring
  </text>
</svg>