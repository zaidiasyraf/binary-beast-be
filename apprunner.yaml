version: 1.0
build:
  commands:
    build:
      - echo "Build started on `date`"
      - mvn clean package -DskipTests
      - echo "Build completed on `date`"
run:
  runtime-version: java17
  command: java -jar target/bedrock-app-1.0.0.jar
  network:
    port: 8080
  env:
    - name: SERVER_PORT
      value: "8080"
    - name: AWS_REGION
      value: "ap-southeast-1"
    - name: SPRING_PROFILES_ACTIVE
      value: "apprunner"
    - name: SPRING_DATASOURCE_URL
      value: "jdbc:postgresql://database-1.cluster-ct8k2m8uiz5p.ap-southeast-1.rds.amazonaws.com:5432/postgres"
    - name: SPRING_DATASOURCE_USERNAME
      value: "postgres"
    - name: SPRING_DATASOURCE_PASSWORD
      value: "BinaryBeast4"