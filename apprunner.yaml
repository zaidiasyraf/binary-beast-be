version: 1.0
build:
  commands:
    build:
      - echo "Build started on `date`"
      - mvn clean package -DskipTests
      - echo "Build completed on `date`"
run:
  runtime-version: java17
  command: java -jar target/bedrock-app-1.0.0.jar
  network:
    port: 8080
  env:
    - name: SERVER_PORT
      value: "8080"
    - name: AWS_REGION
      value: "us-east-1"
    - name: SPRING_PROFILES_ACTIVE
      value: "production"